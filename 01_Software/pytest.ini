[pytest]
testpaths = tests
addopts = -v
markers =
    unitaria: prueba unitaria (reglas de negocio sin BD ni HTTP)
    api: prueba de integracion/API sobre rutas HTTP
    seguridad: prueba de seguridad controlada (REQ-012)
    funcional: prueba funcional de flujo completo sobre servicios y BD
    regresion: retest y regresión tras la corrección de un defecto (BUG-001)
