{% extends "base.html" %}
{% block titulo %}Editar licitación{% endblock %}
{% block contenido %}
<h1>Editar licitación {{ licitacion.codigo }}</h1>
<div class="tarjeta">
  <form method="post" action="/licitaciones/{{ licitacion.id }}/editar">
    <div class="fila">
      <div><label for="codigo">Código</label><input id="codigo" name="codigo" value="{{ form.codigo }}" required></div>
      <div><label for="titulo">Título</label><input id="titulo" name="titulo" value="{{ form.titulo }}" required></div>
    </div>
    <div class="fila">
      <div><label for="presupuesto_crc">Presupuesto (CRC)</label><input id="presupuesto_crc" name="presupuesto_crc" inputmode="decimal" value="{{ form.presupuesto_crc }}" required></div>
      <div><label for="cierre">Cierre (fecha y hora)</label><input id="cierre" name="cierre" type="datetime-local" value="{{ form.cierre }}" required></div>
    </div>
    <button class="primario" type="submit">Guardar cambios</button>
    <a href="/licitaciones" style="margin-left:12px;">Cancelar</a>
  </form>
</div>
{% endblock %}
